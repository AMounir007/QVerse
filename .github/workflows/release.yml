name: Release

# Publishes a GitHub Release (shows in followers' feeds like SHAFT) when a tag like 1.0.2 is pushed.
on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve version
        id: v
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          fi
          # Pinned next version (file .release-version) wins if its tag doesn't exist yet
          if [ -z "$VERSION" ] && [ -f .release-version ]; then
            PIN=$(tr -d ' \r\n' < .release-version)
            if [ -n "$PIN" ] && ! git rev-parse -q --verify "refs/tags/$PIN" >/dev/null; then
              VERSION="$PIN"
            fi
          fi
          if [ -z "$VERSION" ]; then
            LAST=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            [ -z "$LAST" ] && LAST="1.0.0"
            IFS='.' read -r MA MI PA <<< "${LAST%%-*}"
            VERSION="$MA.$MI.$((PA+1))"
          fi
          echo "Releasing $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: mvn -B clean install -DskipTests -Drevision=${{ steps.v.outputs.version }}

      - name: Prepare release notes
        run: |
          V="${{ steps.v.outputs.version }}"
          FILE="docs/RELEASE_NOTES_${V}.md"
          if [ -f "$FILE" ]; then
            cp "$FILE" notes.md
          else
            # Fallback: extract this version's section from CHANGELOG.md
            awk -v v="$V" '
              $0 ~ "^## \\[" v "\\]" {p=1; next}
              p && /^## \[/ {exit}
              p {print}
            ' CHANGELOG.md > notes.md
          fi
          if [ ! -s notes.md ]; then
            PREV=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            echo "## Changes" > notes.md
            git log ${PREV:+$PREV..}HEAD --pretty='- %s (%h)' >> notes.md 2>/dev/null || true
          fi
          cat >> notes.md <<EOF

          ---
          ### 📦 Installation
          \`\`\`xml
          <repository>
            <id>jitpack.io</id>
            <url>https://jitpack.io</url>
          </repository>

          <dependency>
            <groupId>com.github.AMounir007</groupId>
            <artifactId>QVerse</artifactId>
            <version>${V}</version>
          </dependency>
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          name: QVerse ${{ steps.v.outputs.version }}
          body_path: notes.md
          files: target/*.jar
          make_latest: true

      - name: Warm up JitPack build
        continue-on-error: true
        run: curl -s -m 600 "https://jitpack.io/com/github/AMounir007/QVerse/${{ steps.v.outputs.version }}/QVerse-${{ steps.v.outputs.version }}.pom" || true
