browser=CHROME
headless=false
execution.mode=LOCAL
grid.url=http://localhost:4444/wd/hub
download.dir=target/downloads
page.load.timeout.seconds=60

explicit.timeout.seconds=15
polling.interval.millis=250
action.retry.attempts=3
